plugins {
    id 'java'
    id 'io.qameta.allure' version '3.0.0'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

ext {
    appiumVersion = '10.1.1'
    jUnitVersion = "5.10.1"
    allureVersion = "2.29.1"
    assertjVersion = "3.27.7"
    aspectjWeaverVersion = "1.9.25.1"
    slf4jVersion = "2.0.12"
}

repositories {
    mavenCentral()
}

dependencies {
    implementation(
            "io.appium:java-client:$appiumVersion",
            "io.qameta.allure:allure-java-commons:$allureVersion",
            "org.slf4j:slf4j-api:$slf4jVersion",
            "org.slf4j:slf4j-simple:$slf4jVersion",
            "org.assertj:assertj-core:$assertjVersion"
    )

    testImplementation platform("org.junit:junit-bom:$jUnitVersion")
    testImplementation "org.junit.jupiter:junit-jupiter"

    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}


allure {
    adapter {
        allureJavaVersion.set(allureVersion)
        aspectjVersion.set(aspectjWeaverVersion)
    }
    report {
        singleFile.set(true)
    }
}

test {
    useJUnitPlatform()
}

tasks.named('allureReport') {
    outputs.upToDateWhen { false }
    doFirst {
        delete layout.buildDirectory.dir("reports/allure-report").get().asFile
    }
}